apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch
  namespace: net-sec-watch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opensearch
  template:
    metadata:
      labels:
        app: opensearch
    spec:
      serviceAccountName: net-sec-watch-opensearch
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:3.7.0
          ports:
            - containerPort: 9200
          envFrom:
            - configMapRef:
                name: net-sec-watch-config
            - secretRef:
                name: net-sec-watch-secrets
          env:
            - name: discovery.type
              value: single-node
            - name: DISABLE_SECURITY_PLUGIN
              value: "false"
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms2g -Xmx2g"
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: opensearch-data
              mountPath: /usr/share/opensearch/data
            - name: opensearch-snapshots
              mountPath: /usr/share/opensearch/snapshots
      volumes:
        - name: opensearch-data
          persistentVolumeClaim:
            claimName: opensearch-data
        - name: opensearch-snapshots
          persistentVolumeClaim:
            claimName: opensearch-snapshots
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluent-bit
  namespace: net-sec-watch
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fluent-bit
  template:
    metadata:
      labels:
        app: fluent-bit
    spec:
      serviceAccountName: net-sec-watch-collector
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:4.0
          ports:
            - containerPort: 2020
            - containerPort: 5514
              protocol: UDP
            - containerPort: 5514
              protocol: TCP
            - containerPort: 6514
              protocol: TCP
          envFrom:
            - configMapRef:
                name: net-sec-watch-config
            - secretRef:
                name: net-sec-watch-secrets
          resources:
            requests:
              cpu: "250m"
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: fluent-bit-state
              mountPath: /fluent-bit/state
      volumes:
        - name: fluent-bit-state
          persistentVolumeClaim:
            claimName: fluent-bit-state
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch-dashboards
  namespace: net-sec-watch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opensearch-dashboards
  template:
    metadata:
      labels:
        app: opensearch-dashboards
    spec:
      serviceAccountName: net-sec-watch-opensearch
      containers:
        - name: opensearch-dashboards
          image: opensearchproject/opensearch-dashboards:3.7.0
          ports:
            - containerPort: 5601
          envFrom:
            - configMapRef:
                name: net-sec-watch-config
            - secretRef:
                name: net-sec-watch-secrets
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
