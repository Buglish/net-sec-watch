apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: net-sec-watch-read-config
  namespace: net-sec-watch
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: net-sec-watch-collector-read-config
  namespace: net-sec-watch
subjects:
  - kind: ServiceAccount
    name: net-sec-watch-collector
    namespace: net-sec-watch
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: net-sec-watch-read-config
