# Local demo OpenSearch output.
#
# This config is used by `make dashboard-demo`. It keeps the normal collector
# parsing pipeline from fluent-bit.conf and adds plain HTTP OpenSearch outputs
# that match the local non-secure OpenSearch/Dashboards profile.

@INCLUDE /fluent-bit/etc/fluent-bit.base.conf

# Remove redundant scalar aliases that conflict with canonical dotted fields
# when OpenSearch expands dotted keys as objects.
[FILTER]
    Name    modify
    Match   *
    Remove  log
    Remove  service
    Remove  host
    Remove  environment
    Remove  level

[OUTPUT]
    Name                 opensearch
    Match                file.*
    Host                 opensearch
    Port                 9200
    Index                net-sec-watch-application-development
    Suppress_Type_Name   On
    Generate_ID          On
    Retry_Limit          False

[OUTPUT]
    Name                 opensearch
    Match                container.*
    Host                 opensearch
    Port                 9200
    Index                net-sec-watch-application-development
    Suppress_Type_Name   On
    Generate_ID          On
    Retry_Limit          False

[OUTPUT]
    Name                 opensearch
    Match                host.*
    Host                 opensearch
    Port                 9200
    Index                net-sec-watch-system-development
    Suppress_Type_Name   On
    Generate_ID          On
    Retry_Limit          False

[OUTPUT]
    Name                 opensearch
    Match                sensor.*
    Host                 opensearch
    Port                 9200
    Index                net-sec-watch-network-development
    Suppress_Type_Name   On
    Generate_ID          On
    Retry_Limit          False

[OUTPUT]
    Name                 opensearch
    Match                net.*
    Host                 opensearch
    Port                 9200
    Index                net-sec-watch-network-development
    Suppress_Type_Name   On
    Generate_ID          On
    Retry_Limit          False

[OUTPUT]
    Name                 opensearch
    Match                pipeline.*
    Host                 opensearch
    Port                 9200
    Index                net-sec-watch-network-development
    Suppress_Type_Name   On
    Generate_ID          On
    Retry_Limit          False
